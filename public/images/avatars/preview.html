<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Prévia dos 15 Avatares Oficiais - RockBrazil V13.3.1</title>
  <style>
    body {
      background: #0d0b18;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { color: #f59e0b; margin-bottom: 8px; }
    p { color: #94a3b8; margin-top: 0; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      max-width: 1000px;
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    }
    .avatar-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s;
    }
    .avatar-card:hover {
      transform: scale(1.05);
      border-color: #ffd700;
    }
    .avatar-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 8px;
      object-fit: cover;
    }
    .avatar-name {
      font-size: 13px;
      font-weight: bold;
      color: #cbd5e1;
      margin-top: 8px;
    }
  </style>
</head>
